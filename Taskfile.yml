version: '3'
vars:
  binary: getversions
tasks:
  build:
    cmds:
      - go build -o {{.binary}} main.go
    sources:
      - main.go
    generates:
      - ./{{.binary}}
  build-gradle:
    cmds:
      - go build -o {{.binary}}-gradle actions/gradle/main.go
    sources:
      - actions/gradle/main.go
    generates:
      - ./{{.binary}}-gradle
  test:
    cmds:
      - go test ./...
  test-with-coverage:
    cmds:
      - go test -coverprofile=coverage.out ./...
  coverage-report:
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
  clean:
    cmds:
      - rm -f {{.binary}}
