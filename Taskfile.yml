version: '3'
vars:
  binary: getversions
tasks:
  build:
    cmds:
      - go build -o {{.binary}} main.go
    sources:
      - main.go
      - cmd/*.go
      - pkg/action/*.go
      - pkg/utils/*.go
      - pkg/utils/htmlparser/*.go
      - pkg/utils/version/*.go
      - pkg/versions/*.go
    generates:
      - ./{{.binary}}
  build-gradle:
    cmds:
      - go build -o {{.binary}}-gradle actions/gradle/main.go
    sources:
      - actions/gradle/main.go
    generates:
      - ./{{.binary}}-gradle
  test:
    cmds:
      - go test ./...
  clean:
    cmds:
      - rm -f {{.binary}}
